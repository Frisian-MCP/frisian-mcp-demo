---
# frisian-mcp demo — Nautobot
#
# This is Nautobot's own development compose shape — nautobot, celery_worker,
# celery_beat, one redis, one db — with exactly two differences:
#
#   1. the image carries frisian-mcp and the demo's Nautobot apps
#   2. config/nautobot_config.py is mounted over Nautobot's settings file
#
# Point 2 is the demo. The file is in the clone: read it, change it,
# `docker compose restart`, and watch the routes and scopes change.
#
#   docker compose up          pull and run
#   docker compose restart     re-read the config, reset the estate

name: frisian-mcp-demo-nautobot

x-app: &app
  image: "ghcr.io/frisian-mcp/demo-nautobot:${DEMO_TAG:-v0.1.0}"
  restart: unless-stopped
  env_file: [.env]
  environment:
    # Heavy-response continuation cache, on its own logical DB of the one
    # Redis. Nautobot uses 0 for the Celery broker and 1 for the Django
    # cache, so 2 is free. It needs to be separate from the default cache:
    # continuation tokens live there, and an eviction storm on the default
    # cache would otherwise invalidate them.
    FRISIAN_MCP_HEAVY_CACHE_URL: "redis://:${REDIS_PASSWORD:-nautobot}@redis:6379/2"
    FRISIAN_MCP_HEAVY_CACHE_ALIAS: "heavy"
  volumes:
    # THE DEMO. Nautobot ships a settings file; this one replaces it.
    - ./config/nautobot_config.py:/opt/nautobot/nautobot_config.py:ro
    - media_root:/opt/nautobot/media
    - demo_state:/opt/nautobot/demo-state

services:
  nautobot:
    <<: *app
    ports:
      # Loopback by default. 0.0.0.0 publishes a stack whose credentials are
      # printed in the README.
      - "${DEMO_BIND_HOST:-127.0.0.1}:${DEMO_HTTP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nautobot-server", "health_check"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10m

  celery_worker:
    <<: *app
    entrypoint: ["nautobot-server", "celery", "worker", "-l", "INFO", "--events"]
    depends_on:
      nautobot:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nautobot-server celery inspect ping --destination celery@$$HOSTNAME"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  celery_beat:
    <<: *app
    entrypoint: ["nautobot-server", "celery", "beat", "-l", "INFO"]
    depends_on:
      nautobot:
        condition: service_healthy

  redis:
    image: "redis:6-alpine"
    restart: unless-stopped
    command:
      - sh
      - -c
      - redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-nautobot}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h localhost -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: "ghcr.io/frisian-mcp/demo-nautobot-db:${DEMO_TAG:-v0.1.0}"
    restart: unless-stopped
    env_file: [.env]
    # PGDATA is a tmpfs, and that is what makes the demo reproducible: the
    # estate is restored on EVERY start, including `docker compose restart`.
    #
    # Do not replace this with a volume, and do not remove it because "no
    # volume is declared anyway". The postgres image declares VOLUME in its
    # own Dockerfile, so Docker creates an ANONYMOUS one — which Compose then
    # preserves across recreation, including an `up` onto a changed image.
    # Measured: that path skips initdb and comes up green against a stale
    # database. A tmpfs cannot outlive the container, so there is no state to
    # preserve and initdb.d fires every time.
    tmpfs:
      - /var/lib/postgresql/data:size=1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 15m

volumes:
  media_root:
  demo_state:
