# Codex reads ~/.codex/config.toml by default, NOT this file.
# Point CODEX_HOME at this directory to use it:
#
#     cd paperless && CODEX_HOME="$PWD/.codex" codex
#
# Every credential below is a published demo constant. Do not reuse them.

[mcp_servers.paperless-read-only]
url = "http://127.0.0.1:8081/mcp/read-only"

[mcp_servers.paperless-read-only.http_headers]
Authorization = "Bearer frisian-demo-readonly-token-public-do-not-reuse"

[mcp_servers.paperless-read-write]
url = "http://127.0.0.1:8081/mcp/read-write"

[mcp_servers.paperless-read-write.http_headers]
Authorization = "Bearer frisian-demo-editor-token-public-do-not-reuse"

[mcp_servers.paperless-ops]
url = "http://127.0.0.1:8081/mcp/ops"

[mcp_servers.paperless-ops.http_headers]
Authorization = "Bearer frisian-demo-admin-token-public-do-not-reuse"
