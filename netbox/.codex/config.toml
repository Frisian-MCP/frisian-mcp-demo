# Codex reads ~/.codex/config.toml by default, NOT this file.
# Point CODEX_HOME at this directory to use it:
#
#     cd netbox && CODEX_HOME="$PWD/.codex" codex
#
# Every credential below is a published demo constant. Do not reuse them.
#
# NOTE the paths differ per entry, unlike the other demo hosts. This host
# configures FRISIAN_MCP_ROUTES, so each tier has its own URL rather than one
# shared mount point. The admin door is /api/mcp/ops, not /api/mcp/admin --
# MCP clients strip an `admin` suffix and silently retry the bare path.

[mcp_servers.netbox-read-only]
url = "http://127.0.0.1:8083/api/mcp/read-only"

[mcp_servers.netbox-read-only.http_headers]
Authorization = "Bearer frisian-demo-readonly-token-public-do-not-reuse"

[mcp_servers.netbox-read-write]
url = "http://127.0.0.1:8083/api/mcp/read-write"

[mcp_servers.netbox-read-write.http_headers]
Authorization = "Bearer frisian-demo-netops-token-public-do-not-reuse"

[mcp_servers.netbox-ops]
url = "http://127.0.0.1:8083/api/mcp/ops"

[mcp_servers.netbox-ops.http_headers]
Authorization = "Bearer frisian-demo-admin-token-public-do-not-reuse"
