# Seed-stack override. Used ONLY by seed/seed.sh.
#
#   docker compose -f docker-compose.yml -f seed/docker-compose.seed.yml ...
#
# Always invoked from the HOST directory (netbox/), so relative paths resolve
# against netbox/ — the project directory is the first compose file's
# directory, not this file's.
#
# Two differences from the demo stack, and no more. Everything else — ports,
# environment, healthchecks, the tmpfs, the dependency graph — is inherited,
# because a seed run against a stack that differs from the shipped one produces
# an estate that was never tested in the shipped one.
#
#   1. the application image is built from this tree rather than pulled
#   2. the database is a PLAIN postgres, with no baked dump
#
# Point 2 is the whole reason this file exists: the demo db image restores a
# dump that does not exist yet, and this run is what creates it.

x-seedbuild: &seedbuild
  context: .
  dockerfile: Dockerfile
  args:
    FRISIAN_MCP_SPEC: "${FRISIAN_MCP_SPEC:-}"
    FRISIAN_MCP_LOCAL_WHEEL: "${FRISIAN_MCP_LOCAL_WHEEL:-}"
    PIP_INDEX_URL: "${PIP_INDEX_URL:-}"
    PIP_EXTRA_INDEX_URL: "${PIP_EXTRA_INDEX_URL:-}"
    DEMO_TAG: "seed"


# ⚠️ ONLY `netbox` CARRIES `build:`, AND THAT IS NOT A TIDY-UP.
#
# All three application services run the SAME image. Giving all three a build
# section makes the bake builder try to produce the identical tag three times
# concurrently, and it fails with:
#
#     image "...netbox-seed:local": already exists
#
# So one service builds it and the other two reference the tag.
# `pull_policy: never` is what stops them trying to PULL a tag that only exists
# locally — compose builds every build-service before starting anything, so the
# image is present by the time they start.

services:
  netbox:
    build: *seedbuild
    image: "frisian-mcp-demo/netbox-seed:local"
  worker:
    image: "frisian-mcp-demo/netbox-seed:local"
    pull_policy: never
  db:
    image: "docker.io/library/postgres:17"
