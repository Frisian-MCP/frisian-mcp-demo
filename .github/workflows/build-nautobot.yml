# Build and publish the Nautobot demo images.
#
# BAKE ONLY. This workflow never handles the source dump.
#
# The seed pass — restore, migrate, provision identities, reset inherited
# credentials, re-dump — happens OUTSIDE this repository. What arrives here is
# the already-credential-reset golden artifact.
#
# That split is a security property, not a convenience. This repository is
# PUBLIC, and Actions artifacts in public repositories are publicly
# downloadable. Seeding here would put the credential-reset script in the
# position of being the single control between an ordinary bug and working
# credentials against an internet-facing host on the open internet. Baking an
# already-reset artifact is safe by construction instead.
#
#   resolve   derive one DEMO_TAG; both images take it
#   artifact  fetch the golden SQL produced outside this repo
#   verify    build both images amd64-only, run the real zero-flag path,
#             independently assert no inherited credentials survived
#   publish   linux/amd64 + linux/arm64, pushed. Gated.
#
# The db image build is a file copy, so QEMU costs nothing on the arm64 leg.
# Do not reintroduce a seed stage here.

name: build-nautobot

on:
  workflow_dispatch:
    inputs:
      demo_tag:
        description: "Tag applied to BOTH images (app and db). Lockstep — never set these separately."
        required: true
        type: string
      frisian_mcp_spec:
        description: "Full pip requirement specifier for frisian-mcp. REQUIRED — there is no default. Publishing additionally requires a PyPI pin at or above the hardening floor."
        required: true
        type: string
      publish:
        description: "Push to GHCR. Unchecked = build and verify only."
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "nautobot-v*"

concurrency:
  # Serialised per tag: two runs publishing the same DEMO_TAG could push an app
  # image from one run and a db image from another, which is exactly the mixed
  # state the single-tag pin exists to prevent.
  group: build-nautobot-${{ github.event.inputs.demo_tag || github.ref }}
  cancel-in-progress: false

# S-8. Without this, every job inherits the repository default for
# GITHUB_TOKEN — a setting that lives outside this file and may be read-write.
# `publish` re-declares its own and is unaffected.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/frisian-mcp/demo-nautobot
  DB_IMAGE: ghcr.io/frisian-mcp/demo-nautobot-db

  # S-6: there is NO default frisian-mcp spec here, and there must never be
  # one. The Dockerfile was made to fail closed without an explicit pin; a
  # default in this file would be the last remaining path to silently
  # publishing an image built on a version that lacks the hardening.

  # The publish floor. A release BELOW this cannot contain H3 + H9, and the
  # demo's whole posture depends on them.
  #
  # This version does not exist on PyPI yet. That is deliberate: the gate fails
  # closed and the pipeline states that the demo is not publishable today,
  # rather than waiting to be told. Raising it is a deliberate act by whoever
  # confirms which release actually carries the hardening.
  #
  # A version number is NOT evidence of content — `main` also calls itself
  # 1.1.0 and lacks the hardening. The content check lives in nautobot/
  # Dockerfile, which asserts the hardening symbols are present in the
  # installed package at build time. Do not remove it on the assumption that
  # this floor covers it. It does not; they are two different checks.
  FRISIAN_MCP_MIN_VERSION: "1.1.1"

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  resolve:
    name: Resolve the lockstep tag
    runs-on: ubuntu-latest
    outputs:
      demo_tag: ${{ steps.tag.outputs.demo_tag }}
      publish: ${{ steps.tag.outputs.publish }}
      spec: ${{ steps.tag.outputs.spec }}
    steps:
      - id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME#nautobot-}"   # refs/tags/nautobot-v1.2.3 -> v1.2.3
            publish=true
          else
            tag="${{ github.event.inputs.demo_tag }}"
            publish="${{ github.event.inputs.publish }}"
          fi
          spec="${{ github.event.inputs.frisian_mcp_spec }}"

          [ -n "$tag" ] || { echo "::error::No demo tag resolved."; exit 1; }

          # S-6. No fallback value: a build with no pin must stop here rather
          # than quietly resolving to some version nobody chose.
          if [ -z "$spec" ]; then
            echo "::error::frisian_mcp_spec is required and has no default (S-6)."
            echo "A tag-push cannot supply it, so tag-triggered runs must set it"
            echo "via a repository variable or be replaced by workflow_dispatch."
            exit 1
          fi

          echo "demo_tag=$tag"   >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "spec=$spec"      >> "$GITHUB_OUTPUT"
          echo "Both images will be tagged: $tag"
          echo "frisian-mcp spec: $spec"

  # ─────────────────────────────────────────────────────────────────────────
  artifact:
    name: Fetch the golden SQL
    runs-on: ubuntu-latest
    needs: resolve
    steps:
      - name: Fetch
        env:
          GOLDEN_SQL_URL: ${{ vars.GOLDEN_SQL_URL }}
        run: |
          set -euo pipefail
          # A repository VARIABLE, not a secret. The golden artifact is
          # post-credential-reset and safe to publish — that is the entire
          # point of seeding outside this repo. If this ever needs to be a
          # secret, something upstream has gone wrong: the artifact is
          # carrying credentials it should not.
          if [ -z "${GOLDEN_SQL_URL:-}" ]; then
            echo "::error::GOLDEN_SQL_URL is not configured."
            echo "It must point at the credential-reset golden artifact produced"
            echo "OUTSIDE this repository. Do not point it at a source dump."
            exit 1
          fi
          curl -fsSL --retry 3 "$GOLDEN_SQL_URL" -o demo.sql.gz
          gzip -t demo.sql.gz   # fail here rather than inside a docker build
          echo "Golden artifact: $(stat -c%s demo.sql.gz) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: demo-sql-${{ needs.resolve.outputs.demo_tag }}
          path: demo.sql.gz
          retention-days: 7
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  verify:
    name: Verify (amd64, not published)
    runs-on: ubuntu-latest
    needs: [resolve, artifact]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: demo-sql-${{ needs.resolve.outputs.demo_tag }}
          path: nautobot/db/

      - uses: docker/setup-buildx-action@v3

      - name: Build both images, amd64 only, loaded locally
        env:
          DEMO_TAG: ${{ needs.resolve.outputs.demo_tag }}
          SPEC: ${{ needs.resolve.outputs.spec }}
        run: |
          set -euo pipefail
          docker buildx build --load --platform linux/amd64 \
            --build-arg "FRISIAN_MCP_SPEC=${SPEC}" \
            -t "${APP_IMAGE}:${DEMO_TAG}" -f nautobot/Dockerfile nautobot/
          docker buildx build --load --platform linux/amd64 \
            -t "${DB_IMAGE}:${DEMO_TAG}" -f nautobot/db/Dockerfile nautobot/

      - name: Acceptance — the zero-flag path, exactly as a user runs it
        env:
          DEMO_TAG: ${{ needs.resolve.outputs.demo_tag }}
        run: |
          set -euo pipefail
          # No -f chain and no flags. If this needs a flag to pass, the demo is
          # broken for every user regardless of whether CI is green.
          cd nautobot
          docker compose up -d --wait --wait-timeout 1800

      - name: Independently assert no inherited credentials survived
        run: |
          set -euo pipefail
          # Defence in depth. The artifact is reset before it ever reaches this
          # repo, so this should never fire — which is exactly why it runs. A
          # control that is never exercised is not a control, and this one is
          # cheap.
          if [ ! -x nautobot/db/assert-identities.sh ]; then
            echo "::error::nautobot/db/assert-identities.sh missing or not executable."
            echo "Refusing to publish an image whose credential state is unverified."
            exit 1
          fi
          ./nautobot/db/assert-identities.sh

      - name: Acceptance — D5 checklist
        run: |
          set -euo pipefail
          # Owned by the testing seat. Hard-fails if absent so a missing
          # checklist cannot read as a passing build.
          if [ ! -x common/ci/acceptance.sh ]; then
            echo "::error::common/ci/acceptance.sh missing (D5). Refusing to publish unverified images."
            exit 1
          fi
          ./common/ci/acceptance.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          cd nautobot
          docker compose ps || true
          docker compose logs --no-color --tail 200 || true

      - name: Tear down
        if: always()
        run: cd nautobot && docker compose down -v || true

  # ─────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish (multi-arch)
    runs-on: ubuntu-latest
    needs: [resolve, artifact, verify]
    if: needs.resolve.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: GATE — the published image must be built on a released, hardened frisian-mcp
        env:
          SPEC: ${{ needs.resolve.outputs.spec }}
        run: |
          set -euo pipefail

          # 1. It must be a PyPI version pin. This is what makes the rehearsal
          #    lane structurally unable to reach GHCR: a local path, an
          #    editable install, a VCS URL or an unpinned name all stop here,
          #    by construction rather than by discipline.
          if ! printf '%s' "$SPEC" | grep -qE '^frisian-mcp(\[[a-z0-9,._-]+\])?==[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::FRISIAN_MCP_SPEC is not a PyPI version pin: '$SPEC'"
            echo "Publishing requires an exact released version, e.g. frisian-mcp[usage]==1.1.1."
            echo "Local paths, editable installs, VCS URLs and unpinned names are rehearsal-only"
            echo "and must never reach a public GHCR package."
            exit 1
          fi

          # 2. It must be at or above the hardening floor.
          version="${SPEC##*==}"
          lowest=$(printf '%s\n%s\n' "$version" "$FRISIAN_MCP_MIN_VERSION" | sort -V | head -1)
          if [ "$version" != "$FRISIAN_MCP_MIN_VERSION" ] && [ "$lowest" = "$version" ]; then
            echo "::error::frisian-mcp $version is below the publish floor $FRISIAN_MCP_MIN_VERSION."
            echo "The demo's posture depends on H3 + H9. Releases below the floor do not carry them."
            echo "If a qualifying release now exists, raise FRISIAN_MCP_MIN_VERSION deliberately —"
            echo "do not lower it to make this run pass."
            exit 1
          fi

          # Note: neither check proves CONTENT. A version string is not
          # evidence — main also calls itself 1.1.0 without the hardening. The
          # content assertion lives in nautobot/Dockerfile and runs during the
          # image builds below.
          echo "Gate passed: $SPEC (floor $FRISIAN_MCP_MIN_VERSION)"

      - uses: actions/download-artifact@v4
        with:
          name: demo-sql-${{ needs.resolve.outputs.demo_tag }}
          path: nautobot/db/

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both pushes are in one job on purpose. Split across jobs, a failure
      # between them leaves one image published at a tag the other never
      # reaches — the mixed state the lockstep pin exists to prevent.
      - name: Push the db image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./nautobot
          file: ./nautobot/db/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DB_IMAGE }}:${{ needs.resolve.outputs.demo_tag }}
          build-args: |
            DEMO_TAG=${{ needs.resolve.outputs.demo_tag }}
          provenance: true
          sbom: true

      - name: Push the app image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./nautobot
          file: ./nautobot/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.APP_IMAGE }}:${{ needs.resolve.outputs.demo_tag }}
          build-args: |
            FRISIAN_MCP_SPEC=${{ needs.resolve.outputs.spec }}
            DEMO_TAG=${{ needs.resolve.outputs.demo_tag }}
          provenance: true
          sbom: true

      - name: Confirm both images resolve on both arches at the same tag
        run: |
          set -euo pipefail
          # Verifies the guarantee rather than assuming the pushes implied it.
          for img in "${APP_IMAGE}" "${DB_IMAGE}"; do
            echo "--- $img:${{ needs.resolve.outputs.demo_tag }}"
            docker buildx imagetools inspect "$img:${{ needs.resolve.outputs.demo_tag }}" | tee /tmp/manifest.txt
            for arch in amd64 arm64; do
              grep -q "linux/$arch" /tmp/manifest.txt \
                || { echo "::error::$img is missing linux/$arch"; exit 1; }
            done
          done

      - name: Summary
        run: |
          {
            echo "### Published"
            echo ""
            echo '```'
            echo "${APP_IMAGE}:${{ needs.resolve.outputs.demo_tag }}"
            echo "${DB_IMAGE}:${{ needs.resolve.outputs.demo_tag }}"
            echo "frisian-mcp: ${{ needs.resolve.outputs.spec }}"
            echo '```'
            echo ""
            echo "Both images carry the same tag. Do not pull them at different tags."
            echo ""
            echo "GHCR package visibility is NOT inherited from repository visibility."
            echo "On a first publish, flip BOTH packages to public — see common/docs/PUBLISHING.md."
          } >> "$GITHUB_STEP_SUMMARY"
