# Build and publish the Nautobot demo images.
#
# BAKE ONLY. This workflow never handles the source dump.
#
# The seed pass — restore, migrate, provision identities, reset inherited
# credentials, re-dump — happens OUTSIDE this repository. What arrives here is
# the already-credential-reset golden artifact.
#
# That split is a security property, not a convenience. This repository is
# PUBLIC, and Actions artifacts in public repositories are publicly
# downloadable. Seeding here would put the credential-reset script in the
# position of being the single control between an ordinary bug and working
# credentials against an internet-facing host on the open internet. Baking an
# already-reset artifact is safe by construction instead.
#
#   resolve   derive one DEMO_TAG; both images take it
#   artifact  fetch the golden SQL produced outside this repo
#   verify    build both images amd64-only, run the real zero-flag path,
#             independently assert no inherited credentials survived
#   publish   linux/amd64 + linux/arm64, pushed. Gated.
#
# The db image build is a file copy, so QEMU costs nothing on the arm64 leg.
# Do not reintroduce a seed stage here.

name: build-nautobot

on:
  workflow_dispatch:
    inputs:
      demo_tag:
        description: "Tag applied to BOTH images (app and db). Lockstep — never set these separately."
        required: true
        type: string
      frisian_mcp_spec:
        description: "PyPI requirement specifier, e.g. frisian-mcp[usage]==1.1.0. Required for the testpypi and release lanes. Leave empty on rehearsal."
        required: false
        default: ""
        type: string
      frisian_mcp_local_wheel:
        description: "Wheel filename under nautobot/wheels/. Required for the rehearsal lane. Leave empty otherwise. Note: wheels are gitignored, so CI has none."
        required: false
        default: ""
        type: string
      lane:
        description: "Where frisian-mcp comes from. Only 'release' may publish to GHCR."
        required: false
        default: rehearsal
        type: choice
        options: [rehearsal, testpypi, release]
      publish:
        description: "Push to GHCR. Unchecked = build and verify only. Ignored unless lane=release."
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "nautobot-v*"

concurrency:
  # Serialised per tag: two runs publishing the same DEMO_TAG could push an app
  # image from one run and a db image from another, which is exactly the mixed
  # state the single-tag pin exists to prevent.
  group: build-nautobot-${{ github.event.inputs.demo_tag || github.ref }}
  cancel-in-progress: false

# S-8. Without this, every job inherits the repository default for
# GITHUB_TOKEN — a setting that lives outside this file and may be read-write.
# `publish` re-declares its own and is unaffected.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/frisian-mcp/demo-nautobot
  DB_IMAGE: ghcr.io/frisian-mcp/demo-nautobot-db

  # S-6: there is NO default frisian-mcp spec here, and there must never be
  # one. The Dockerfile was made to fail closed without an explicit pin; a
  # default in this file would be the last remaining path to silently
  # publishing an image built on a version that lacks the hardening.

  # The publish floor. A release BELOW this cannot contain H3 + H9, and the
  # demo's whole posture depends on them.
  #
  # Lowered 1.1.1 -> 1.1.0. The floor was set above 1.1.0 only because a 1.1.0
  # might have been cut from a tree without the hardening. PR #62 merged, so
  # `origin/main` IS 1.1.0 with the hardening — verified as `git diff --stat
  # feat/post-1.1.0-hardening origin/main -- src/` being empty — and no v1.1.0
  # tag exists anywhere, so the hardening-less 1.1.0 can no longer happen.
  #
  # A floor kept artificially high stops being a gate and becomes superstition.
  #
  # A version number is STILL not evidence of content. This is a coarse filter
  # in front of the real guarantee, which is the build-time assertion in
  # nautobot/Dockerfile that the hardening symbols are importable from the
  # installed package. Do not remove that on the assumption this floor covers
  # it. It does not; they are two different checks.
  FRISIAN_MCP_MIN_VERSION: "1.1.0"

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  resolve:
    name: Resolve the lockstep tag
    runs-on: ubuntu-latest
    outputs:
      demo_tag: ${{ steps.tag.outputs.demo_tag }}
      publish: ${{ steps.tag.outputs.publish }}
      spec: ${{ steps.tag.outputs.spec }}
      local_wheel: ${{ steps.tag.outputs.local_wheel }}
      lane: ${{ steps.tag.outputs.lane }}
      pip_index_url: ${{ steps.tag.outputs.pip_index_url }}
      pip_extra_index_url: ${{ steps.tag.outputs.pip_extra_index_url }}
    steps:
      - id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME#nautobot-}"   # refs/tags/nautobot-v1.2.3 -> v1.2.3
            publish=true
            lane=release
          else
            tag="${{ github.event.inputs.demo_tag }}"
            publish="${{ github.event.inputs.publish }}"
            # Defaults to `rehearsal`, the lane that cannot publish. A missing
            # or unrecognised value must not fall through to the one that can.
            lane="${{ github.event.inputs.lane }}"
            lane="${lane:-rehearsal}"
          fi
          case "$lane" in
            rehearsal|testpypi|release) ;;
            *) echo "::error::Unknown lane '$lane'."; exit 1 ;;
          esac
          spec="${{ github.event.inputs.frisian_mcp_spec }}"
          wheel="${{ github.event.inputs.frisian_mcp_local_wheel }}"

          [ -n "$tag" ] || { echo "::error::No demo tag resolved."; exit 1; }

          # S-6, and it mirrors the Dockerfile's own guard rather than
          # duplicating half of it. There is no fallback value in either
          # place: a build with no source must stop rather than quietly
          # resolving to some version nobody chose, and a build with TWO
          # sources must stop rather than silently picking a lane — which is
          # how the unreproducible image arose in the first place.
          if [ -n "$spec" ] && [ -n "$wheel" ]; then
            echo "::error::Both frisian_mcp_spec and frisian_mcp_local_wheel are set. Pick one lane."
            exit 1
          fi
          if [ -z "$spec" ] && [ -z "$wheel" ]; then
            echo "::error::No frisian-mcp source selected, and there is no default (S-6)."
            echo "  testpypi/release lane: frisian_mcp_spec"
            echo "  rehearsal lane:        frisian_mcp_local_wheel"
            echo "A tag push cannot supply either, so tag-triggered runs must set"
            echo "frisian_mcp_spec via a repository variable."
            exit 1
          fi

          # The lane and the source have to agree. A wheel on the release lane
          # is the case that matters: it would publish an image built from a
          # file nobody else can reproduce.
          case "$lane" in
            rehearsal)
              [ -n "$wheel" ] || { echo "::error::lane=rehearsal needs frisian_mcp_local_wheel, not a PyPI spec."; exit 1; } ;;
            testpypi|release)
              [ -n "$spec" ] || { echo "::error::lane=$lane needs frisian_mcp_spec, not a local wheel."; exit 1; } ;;
          esac

          echo "demo_tag=$tag"   >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "spec=$spec"      >> "$GITHUB_OUTPUT"
          echo "local_wheel=$wheel" >> "$GITHUB_OUTPUT"
          echo "lane=$lane"      >> "$GITHUB_OUTPUT"
          echo "lane: $lane"

          # The index is a SEPARATE axis from the requirement specifier, on
          # purpose. Test PyPI needs --index-url plus real PyPI as an extra
          # index (it does not carry Django, DRF or jsonschema), but folding
          # those flags into FRISIAN_MCP_SPEC would mean widening the publish
          # gate to admit index flags — and that gate rejecting them is the
          # thing keeping an arbitrary index out of a published image.
          #
          # So the spec stays a bare pin in every lane, and the index travels
          # beside it where the gate can require it to be empty.
          case "$lane" in
            testpypi)
              echo "pip_index_url=https://test.pypi.org/simple/" >> "$GITHUB_OUTPUT"
              echo "pip_extra_index_url=https://pypi.org/simple/" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "pip_index_url=" >> "$GITHUB_OUTPUT"
              echo "pip_extra_index_url=" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "Both images will be tagged: $tag"
          echo "frisian-mcp spec: $spec"

  # ─────────────────────────────────────────────────────────────────────────
  artifact:
    name: Fetch the golden SQL
    runs-on: ubuntu-latest
    needs: resolve
    steps:
      - name: Fetch
        env:
          GOLDEN_SQL_URL: ${{ vars.GOLDEN_SQL_URL }}
        run: |
          set -euo pipefail
          # A repository VARIABLE, not a secret. The golden artifact is
          # post-credential-reset and safe to publish — that is the entire
          # point of seeding outside this repo. If this ever needs to be a
          # secret, something upstream has gone wrong: the artifact is
          # carrying credentials it should not.
          if [ -z "${GOLDEN_SQL_URL:-}" ]; then
            echo "::error::GOLDEN_SQL_URL is not configured."
            echo "It must point at the credential-reset golden artifact produced"
            echo "OUTSIDE this repository. Do not point it at a source dump."
            exit 1
          fi
          curl -fsSL --retry 3 "$GOLDEN_SQL_URL" -o demo.sql.gz
          gzip -t demo.sql.gz   # fail here rather than inside a docker build
          echo "Golden artifact: $(stat -c%s demo.sql.gz) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: demo-sql-${{ needs.resolve.outputs.demo_tag }}
          path: demo.sql.gz
          retention-days: 7
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  verify:
    name: Verify (amd64, not published)
    runs-on: ubuntu-latest
    needs: [resolve, artifact]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: demo-sql-${{ needs.resolve.outputs.demo_tag }}
          path: nautobot/db/

      - uses: docker/setup-buildx-action@v3

      - name: Guard — the Test PyPI lane must actually be wired
        if: needs.resolve.outputs.lane == 'testpypi'
        run: |
          set -euo pipefail
          # Docker IGNORES a build-arg the Dockerfile does not declare, and only
          # warns. Without this check, a Test PyPI build would silently install
          # from real PyPI and report success — a pre-release lane that
          # validated the wrong artifact, which is worse than not having one.
          for a in PIP_INDEX_URL PIP_EXTRA_INDEX_URL; do
            grep -qE "^ARG[[:space:]]+$a" nautobot/Dockerfile || {
              echo "::error::nautobot/Dockerfile does not declare 'ARG $a'."
              echo "The build-arg would be ignored and this lane would quietly build"
              echo "from real PyPI while claiming to validate the Test PyPI artifact."
              exit 1
            }
          done

      - name: Guard — the rehearsal lane needs a wheel that CI does not have
        if: needs.resolve.outputs.lane == 'rehearsal'
        env:
          WHEEL: ${{ needs.resolve.outputs.local_wheel }}
        run: |
          set -euo pipefail
          # nautobot/wheels/*.whl is gitignored, deliberately — a rehearsal
          # wheel is a build input, never a repo artifact. So a fresh checkout
          # has none, and the rehearsal lane is a LOCAL lane by construction.
          #
          # Saying so here beats a confusing COPY failure four steps later.
          if [ ! -f "nautobot/wheels/${WHEEL}" ]; then
            echo "::error::nautobot/wheels/${WHEEL} is not in this checkout."
            echo "Rehearsal wheels are gitignored, so this lane cannot run in CI."
            echo "Build it locally, or use the testpypi/release lane here."
            exit 1
          fi

      - name: Build both images, amd64 only, loaded locally
        env:
          DEMO_TAG: ${{ needs.resolve.outputs.demo_tag }}
          SPEC: ${{ needs.resolve.outputs.spec }}
          WHEEL: ${{ needs.resolve.outputs.local_wheel }}
          IDX: ${{ needs.resolve.outputs.pip_index_url }}
          XIDX: ${{ needs.resolve.outputs.pip_extra_index_url }}
        run: |
          set -euo pipefail
          # Both lane args are passed and exactly one is non-empty; the
          # Dockerfile refuses if that stops being true.
          docker buildx build --load --platform linux/amd64 \
            --build-arg "FRISIAN_MCP_SPEC=${SPEC}" \
            --build-arg "FRISIAN_MCP_LOCAL_WHEEL=${WHEEL}" \
            --build-arg "PIP_INDEX_URL=${IDX}" \
            --build-arg "PIP_EXTRA_INDEX_URL=${XIDX}" \
            -t "${APP_IMAGE}:${DEMO_TAG}" -f nautobot/Dockerfile nautobot/
          docker buildx build --load --platform linux/amd64 \
            -t "${DB_IMAGE}:${DEMO_TAG}" -f nautobot/db/Dockerfile nautobot/

      - name: Acceptance — the zero-flag path, exactly as a user runs it
        env:
          DEMO_TAG: ${{ needs.resolve.outputs.demo_tag }}
        run: |
          set -euo pipefail
          # No -f chain and no flags. If this needs a flag to pass, the demo is
          # broken for every user regardless of whether CI is green.
          cd nautobot
          docker compose up -d --wait --wait-timeout 1800

      - name: Independently assert no inherited credentials survived
        run: |
          set -euo pipefail
          # Defence in depth. The artifact is reset before it ever reaches this
          # repo, so this should never fire — which is exactly why it runs. A
          # control that is never exercised is not a control, and this one is
          # cheap.
          if [ ! -x nautobot/db/assert-identities.sh ]; then
            echo "::error::nautobot/db/assert-identities.sh missing or not executable."
            echo "Refusing to publish an image whose credential state is unverified."
            exit 1
          fi
          ./nautobot/db/assert-identities.sh

      - name: Acceptance — D5 checklist
        run: |
          set -euo pipefail
          # Owned by the testing seat. Hard-fails if absent so a missing
          # checklist cannot read as a passing build.
          if [ ! -x common/ci/acceptance.sh ]; then
            echo "::error::common/ci/acceptance.sh missing (D5). Refusing to publish unverified images."
            exit 1
          fi
          ./common/ci/acceptance.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          cd nautobot
          docker compose ps || true
          docker compose logs --no-color --tail 200 || true

      - name: Tear down
        if: always()
        run: cd nautobot && docker compose down -v || true

  # ─────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish (multi-arch)
    runs-on: ubuntu-latest
    needs: [resolve, artifact, verify]
    if: needs.resolve.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: GATE — the published image must be built on a released, hardened frisian-mcp
        env:
          SPEC: ${{ needs.resolve.outputs.spec }}
        env:
          LANE: ${{ needs.resolve.outputs.lane }}
          IDX: ${{ needs.resolve.outputs.pip_index_url }}
          XIDX: ${{ needs.resolve.outputs.pip_extra_index_url }}
        run: |
          set -euo pipefail

          # 0. Only the release lane may publish.
          #
          #    rehearsal builds from local source; testpypi builds from an index
          #    that is explicitly NON-DURABLE — files can be deleted and it
          #    prunes. Either is fine for validating our own work and neither is
          #    fine underneath someone else's `docker pull`, where the image
          #    outlives the index it was built from.
          if [ "$LANE" != "release" ]; then
            echo "::error::lane is '$LANE'. Only 'release' may publish to GHCR."
            echo "rehearsal = local source; testpypi = non-durable index. Neither ships."
            exit 1
          fi

          # 0a. A local wheel can never back a published image: nobody outside
          #     this machine can reproduce it, and the lane check above should
          #     already have caught it.
          if [ -n "${{ needs.resolve.outputs.local_wheel }}" ]; then
            echo "::error::A local wheel is set on the release lane. A published image must come from an index."
            exit 1
          fi

          # 0b. Belt and braces: the release lane sets no index override, so a
          #     non-empty one here means the lane and the index disagree.
          if [ -n "${IDX:-}" ] || [ -n "${XIDX:-}" ]; then
            echo "::error::A pip index override is set on the release lane (index='${IDX:-}' extra='${XIDX:-}')."
            echo "A published image must resolve from real PyPI only."
            exit 1
          fi

          # 1. It must be a PyPI version pin. This is what makes the rehearsal
          #    lane structurally unable to reach GHCR: a local path, an
          #    editable install, a VCS URL or an unpinned name all stop here,
          #    by construction rather than by discipline.
          if ! printf '%s' "$SPEC" | grep -qE '^frisian-mcp(\[[a-z0-9,._-]+\])?==[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::FRISIAN_MCP_SPEC is not a PyPI version pin: '$SPEC'"
            echo "Publishing requires an exact released version, e.g. frisian-mcp[usage]==1.1.1."
            echo "Local paths, editable installs, VCS URLs and unpinned names are rehearsal-only"
            echo "and must never reach a public GHCR package."
            exit 1
          fi

          # 2. It must be at or above the hardening floor.
          version="${SPEC##*==}"
          lowest=$(printf '%s\n%s\n' "$version" "$FRISIAN_MCP_MIN_VERSION" | sort -V | head -1)
          if [ "$version" != "$FRISIAN_MCP_MIN_VERSION" ] && [ "$lowest" = "$version" ]; then
            echo "::error::frisian-mcp $version is below the publish floor $FRISIAN_MCP_MIN_VERSION."
            echo "The demo's posture depends on H3 + H9. Releases below the floor do not carry them."
            echo "If a qualifying release now exists, raise FRISIAN_MCP_MIN_VERSION deliberately —"
            echo "do not lower it to make this run pass."
            exit 1
          fi

          # Note: neither check proves CONTENT. A version string is not
          # evidence — main also calls itself 1.1.0 without the hardening. The
          # content assertion lives in nautobot/Dockerfile and runs during the
          # image builds below.
          echo "Gate passed: $SPEC (floor $FRISIAN_MCP_MIN_VERSION)"

      - uses: actions/download-artifact@v4
        with:
          name: demo-sql-${{ needs.resolve.outputs.demo_tag }}
          path: nautobot/db/

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both pushes are in one job on purpose. Split across jobs, a failure
      # between them leaves one image published at a tag the other never
      # reaches — the mixed state the lockstep pin exists to prevent.
      - name: Push the db image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./nautobot
          file: ./nautobot/db/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DB_IMAGE }}:${{ needs.resolve.outputs.demo_tag }}
          build-args: |
            DEMO_TAG=${{ needs.resolve.outputs.demo_tag }}
          provenance: true
          sbom: true

      - name: Push the app image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./nautobot
          file: ./nautobot/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.APP_IMAGE }}:${{ needs.resolve.outputs.demo_tag }}
          build-args: |
            FRISIAN_MCP_SPEC=${{ needs.resolve.outputs.spec }}
            DEMO_TAG=${{ needs.resolve.outputs.demo_tag }}
            PIP_INDEX_URL=
            PIP_EXTRA_INDEX_URL=
          provenance: true
          sbom: true

      - name: Confirm both images resolve on both arches at the same tag
        run: |
          set -euo pipefail
          # Verifies the guarantee rather than assuming the pushes implied it.
          for img in "${APP_IMAGE}" "${DB_IMAGE}"; do
            echo "--- $img:${{ needs.resolve.outputs.demo_tag }}"
            docker buildx imagetools inspect "$img:${{ needs.resolve.outputs.demo_tag }}" | tee /tmp/manifest.txt
            for arch in amd64 arm64; do
              grep -q "linux/$arch" /tmp/manifest.txt \
                || { echo "::error::$img is missing linux/$arch"; exit 1; }
            done
          done

      - name: Summary
        run: |
          {
            echo "### Published"
            echo ""
            echo '```'
            echo "${APP_IMAGE}:${{ needs.resolve.outputs.demo_tag }}"
            echo "${DB_IMAGE}:${{ needs.resolve.outputs.demo_tag }}"
            echo "frisian-mcp: ${{ needs.resolve.outputs.spec }}"
            echo '```'
            echo ""
            echo "Both images carry the same tag. Do not pull them at different tags."
            echo ""
            echo "GHCR package visibility is NOT inherited from repository visibility."
            echo "On a first publish, flip BOTH packages to public — see common/docs/PUBLISHING.md."
          } >> "$GITHUB_STEP_SUMMARY"
